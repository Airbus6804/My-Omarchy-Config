# ────────────────────────────────────────────────────────────
# Hyprlock — frosted panel, tuned to the Farline palette
# Palette defaults below are overridden by the active theme.
# The extended variables are injected into each theme by
# utils/inject-hyprlock.sh in the My-Omarchy-Config repo.
# ────────────────────────────────────────────────────────────

# Base colors, in case a theme leaves any of them undefined
$color = rgba(28, 31, 37, 1)
$inner_color = rgba(28, 31, 37, 0.55)
$outer_color = rgba(150, 160, 175, 1)
$font_color = rgba(230, 232, 235, 1)
$check_color = rgba(126, 173, 172, 1)

$panel_color = rgba(28, 31, 37, 0.40)
$panel_border = rgba(84, 106, 122, 0.45)
$muted_color = rgba(214, 220, 217, 0.55)
$accent_soft = rgba(190, 167, 173, 0.80)
$fail_color = rgba(164, 132, 132, 1)

source = ~/.config/omarchy/current/theme/hyprlock.conf

$font = JetBrainsMono NF
$font_light = JetBrainsMono NF Light

general {
    ignore_empty_input = true
    hide_cursor = true
    text_trim = true
}

animations {
    enabled = true

    bezier = easeSoft, 0.18, 0.55, 0.32, 1

    animation = fadeIn, 1, 3.0, easeSoft
    animation = fadeOut, 1, 2.4, easeSoft
}

# ── Wallpaper ────────────────────────────────────────────────
background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background

    blur_passes = 4
    blur_size = 5
    brightness = 0.62
    contrast = 0.95
    vibrancy = 0.12
    vibrancy_darkness = 0.15
    noise = 0.012
}

# ── Frosted card ─────────────────────────────────────────────
shape {
    monitor =
    size = 560, 400
    position = 0, 10
    halign = center
    valign = center

    color = $panel_color
    rounding = 20
    border_size = 2
    border_color = $panel_border
    zindex = 0
}

# Hairline under the date
shape {
    monitor =
    size = 200, 1
    position = 0, 25
    halign = center
    valign = center

    color = $panel_border
    rounding = 0
    border_size = 0
    zindex = 1
}

# ── Clock ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000]date +"%H:%M"
    color = $font_color
    font_size = 92
    font_family = $font_light
    zindex = 2

    position = 0, 130
    halign = center
    valign = center
}

# ── Date ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000]date +"%A, %-d %B"
    color = $accent_soft
    font_size = 15
    font_family = $font
    zindex = 2

    position = 0, 58
    halign = center
    valign = center
}

# ── Password ─────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 48
    position = 0, -38
    halign = center
    valign = center
    zindex = 2

    inner_color = $inner_color
    outer_color = $panel_border
    outline_thickness = 2
    rounding = 12

    font_family = $font
    font_color = $font_color
    placeholder_text = <i>Enter password</i>

    dots_size = 0.24
    dots_spacing = 0.42
    dots_center = true

    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $outer_color

    fade_on_empty = false
    shadow_passes = 0
}

# ── Greeting ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000]~/.config/hypr/lock/greeting.sh
    color = $muted_color
    font_size = 14
    font_family = $font
    zindex = 2

    position = 0, -118
    halign = center
    valign = center
}

# ── Battery (bottom left) ────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000]~/.config/hypr/lock/battery.sh
    color = $muted_color
    font_size = 13
    font_family = $font
    zindex = 2

    position = 40, 32
    halign = left
    valign = bottom

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ── Uptime (bottom right) ────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000]uptime -p | sed 's/^up /󰔟  up /'
    color = $muted_color
    font_size = 13
    font_family = $font
    zindex = 2

    position = -40, 32
    halign = right
    valign = bottom

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

auth {
    fingerprint:enabled = false
}
