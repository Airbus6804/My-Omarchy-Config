# Legacy Omarchy 3 entry point — no longer used by Omarchy 4.
# Hyprland loads ~/.config/hypr/hyprland.lua instead.
#
# Your settings now live in:
#   bindings.lua   — keybindings
#   input.lua      — keyboard layout, trackpad, gestures
#   monitors.lua   — monitor layout
#   looknfeel.lua  — decoration, layer rules
#   windows.lua    — window rules
#   hyprlock.conf  — lock screen (still .conf, used by hyprlock)
